<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>wafflioz.vip</title>
    <script>
      (function () {
        // Glitch title effect
        const glitchText = "wafflioz.vip";
        const glitchChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        let glitchIndex = 0;

        function glitchEffect() {
          const glitched = glitchText
            .split("")
            .map((char, i) => {
              return i < glitchIndex
                ? char
                : glitchChars[Math.floor(Math.random() * glitchChars.length)];
            })
            .join("");

          document.title = glitched;

          if (glitchIndex <= glitchText.length) {
            glitchIndex++;
            setTimeout(glitchEffect, 100);
          } else {
            // reset after a pause so the effect repeats
            glitchIndex = 0;
            setTimeout(glitchEffect, 1000);
          }
        }

        // Start the effect when the page is visible to avoid running while hidden
        function startWhenVisible() {
          if (document.visibilityState === "visible") {
            glitchEffect();
          } else {
            document.addEventListener("visibilitychange", function onVis() {
              if (document.visibilityState === "visible") {
                document.removeEventListener("visibilitychange", onVis);
                glitchEffect();
              }
            });
          }
        }

        // Set initial title and start
        document.title = glitchText;
        startWhenVisible();
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
